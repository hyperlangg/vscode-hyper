name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the VSIX to (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx --yes @vscode/vsce package --no-git-tag-version
      - name: Attach VSIX to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          set -eu
          vsix=$(ls hyper-*.vsix)
          test -f "$vsix"
          echo "Attaching $vsix to $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$vsix" --clobber
          else
            gh release create "$TAG" "$vsix" --title "$TAG" --generate-notes
          fi
